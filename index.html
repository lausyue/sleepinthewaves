let timer;
function addButton(id,name){const add=button('Add to cart',()=>{const full=basket[id]>=99;change(id,1);$('notice').textContent=full?'Quantity limit reached':name+' added';clearTimeout(timer);timer=setTimeout(()=>$('notice').textContent='',2000)});add.className='buy';
 const label='Add '+name+' to cart';
 add.setAttribute('aria-label',label);
 add.title=label;
 add.innerHTML='<svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h3l2.3 11h11.8l2.2-8H6"/><circle cx="9" cy="19" r="1.2"/><circle cx="18" cy="19" r="1.2"/></svg>';
 return add}
function display(category){$('grid').replaceChildren();$('listing').textContent=category;for(const b of $('filters').querySelectorAll('button'))b.setAttribute('aria-pressed',String(b.textContent===category));const items=category==='Stickers'
 ? products.filter(item=>item[2]==='Stickers').sort((a,b)=>
     Number(/transparent sticker sheet/i.test(b[1]))-Number(/transparent sticker sheet/i.test(a[1])))
 : products;
 for(const [id,name,type,color,src] of items){const group=['Incense holders','Decorations'].includes(type)?'Ceramics':'Paper goods';if(category!==group&&category!==type)continue;const card=document.createElement('article');card.style.setProperty('--bg',color);card.innerHTML='<a class="frame" href="#product/'+id+'"><img alt="'+name+'" src="'+src+'"></a><h3>'+name+'</h3>';card.querySelector('a').href=pageUrl+'#product/'+id;card.append(addButton(id,name));$('grid').append(card)}$('empty').hidden=$('grid').childElementCount>0}
for(const categories of [['Paper goods','Calendars','Stickers','Postcards','Masking tapes','Memo pads'],['Ceramics','Incense holders','Decorations']]){
 const group=document.createElement('div');
 group.className='menu-group';
 const [label,...children]=categories;
 const menu=document.createElement('div');
 menu.className='submenu';
 menu.id='menu-'+label.replace(/ /g,'-');
 const toggle=button(label,()=>{display(label);setOpen(!pinned);pinned=!menu.hidden});
 toggle.className='menu-toggle';
 toggle.setAttribute('aria-controls',menu.id);
 let pinned=false;
 function setOpen(open){
   menu.hidden=!open;
   toggle.setAttribute('aria-expanded',String(open));
   if(!open)pinned=false;
 }
 setOpen(false);
 for(const category of children){
   menu.append(button(category,()=>{display(category);toggle.focus();setOpen(false)}));
 }
 group.append(toggle,menu);
 group.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')setOpen(true)});
 group.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'&&!pinned&&!menu.contains(document.activeElement))setOpen(false)});
 group.addEventListener('focusout',e=>{if(!group.contains(e.relatedTarget))setOpen(false)});
 group.addEventListener('keydown',e=>{if(e.key==='Escape'){toggle.focus();setOpen(false)}});
 document.addEventListener('pointerdown',e=>{if(!group.contains(e.target))setOpen(false)});
 $('filters').append(group);
}
$('bag').onclick=()=>$('cart').showModal();$('closeCart').onclick=()=>$('cart').close();display('Paper goods');refresh();

const screenEl=document.querySelector('.cinema');
let frame=0;
let playing=!matchMedia('(prefers-reduced-motion: reduce)').matches;
let advanceTimer;
// Product outlines in the original square artwork, in thousandths of its width.
const sheet=[289,114,711,114,711,886,289,886];
const strip=[322,122,658,122,658,878,322,878];
function rect(x,y,r,b){return [x,y,r,y,r,b,x,b]}
const outlines=[
 [rect(235,115,772,885)], [rect(306,211,695,753)],
 [rect(467,184,756,359),rect(170,351,471,522),rect(593,424,828,647),rect(245,630,545,775)],
 [sheet],[strip],[sheet],[sheet],
 [[320,254,372,254,372,231,711,205,729,427,674,433,674,503,320,503],
 [295,516,631,552,630,565,674,565,674,795,319,795,319,733,272,724]],
 [sheet],[sheet],[strip],
 [rect(229,348,754,416),rect(150,430,847,547),rect(282,552,802,645)],
 [rect(140,376,726,484),rect(247,490,870,570)],
 [[172,435,596,394,602,463,180,505],[375,478,850,540,839,608,367,550]],
 [rect(208,290,461,600),[520,407,857,444,825,738,490,702]],
 [strip],[strip]
];
const cutouts=new Map();
function cutout(index){
 if(cutouts.has(index))return cutouts.get(index);
 const ready=(async()=>{
  const source=new Image();source.src=products[index][4];await source.decode();
  const shapes=outlines[index],xs=shapes.flatMap(p=>p.filter((_,i)=>i%2===0)),ys=shapes.flatMap(p=>p.filter((_,i)=>i%2===1));
  const left=Math.min(...xs),top=Math.min(...ys);
  const canvas=document.createElement('canvas');
  canvas.width=Math.ceil((Math.max(...xs)-left)*source.width/1000);
  canvas.height=Math.ceil((Math.max(...ys)-top)*source.height/1000);
  const ctx=canvas.getContext('2d');
  ctx.scale(source.width/1000,source.height/1000);ctx.translate(-left,-top);
  ctx.beginPath();for(const p of shapes){ctx.moveTo(p[0],p[1]);for(let n=2;n<p.length;n+=2)ctx.lineTo(p[n],p[n+1]);ctx.closePath()}
  ctx.clip();ctx.drawImage(source,0,0,1000,1000);
  return canvas.toDataURL();
 })();cutouts.set(index,ready);return ready;
}
const scenes=products.map((_,index)=>[(2*index)%products.length,(2*index+1)%products.length]);
function renderFrame(){
 const links=scenes[frame].map(index=>{
  const [id,name]=products[index];
  const link=document.createElement('a');
  link.href=pageUrl+'#product/'+id;
  const image=new Image();
  image.alt=name;
  cutout(index).then(src=>image.src=src);
  link.append(image);
  return link;
 });
 $('film').replaceChildren(...links);
}
function schedule(){
 clearTimeout(advanceTimer);
 $('playback').textContent=playing?'pause':'play';
 if(playing&&!document.hidden&&!document.querySelector('.catalogue').hidden&&!$('film').contains(document.activeElement))
   advanceTimer=setTimeout(()=>advance(1),5000);
}
function advance(step){
 frame=(frame+step+scenes.length)%scenes.length;
 renderFrame();schedule();
}
screenEl.querySelector('.prev').onclick=()=>advance(-1);
screenEl.querySelector('.next').onclick=()=>advance(1);
$('playback').onclick=()=>{playing=!playing;schedule()};
screenEl.addEventListener('focusin',schedule);
screenEl.addEventListener('focusout',()=>queueMicrotask(schedule));
document.addEventListener('visibilitychange',schedule);
window.addEventListener('hashchange',()=>{showPage();schedule()});
showPage();renderFrame();schedule();
</script></html>
