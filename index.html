const $=id=>document.getElementById(id);
function button(label,action){const b=document.createElement('button');b.textContent=label;b.onclick=action;return b}
let basket={};
try{const stored=JSON.parse(localStorage.getItem('fair-cart-v1'));for(const [id] of products)if(Number.isSafeInteger(stored?.[id])&&stored[id]>0)basket[id]=Math.min(stored[id],99)}catch{}
function refresh(){const total=Object.values(basket).reduce((sum,n)=>sum+n,0);$('bag').textContent='Cart ('+total+')';$('items').replaceChildren();if(!total)$('items').textContent='Your cart is empty.';for(const [id,name,,,src] of products){if(!basket[id])continue;const row=document.createElement('div');row.className='item';const image=new Image();image.src=src;image.alt='';const title=document.createElement('span');title.textContent=name;row.append(image,title);for(const n of [-1,1]){const b=button(n<0?'−':'+',()=>{change(id,n);const target=$('items').querySelector('[data-key="'+id+n+'"]');(target&&!target.disabled?target:$('closeCart')).focus()});b.dataset.key=id+n;b.setAttribute('aria-label',(n<0?'Remove one ':'Add one ')+name);b.disabled=n>0&&basket[id]>=99;if(n>0)row.append(String(basket[id]));row.append(b)}$('items').append(row)}}
function change(id,n){basket[id]=Math.min(99,Math.max(0,(basket[id]||0)+n));if(!basket[id])delete basket[id];try{localStorage.setItem('fair-cart-v1',JSON.stringify(basket))}catch{}refresh()}
let timer;
function display(category){$('grid').replaceChildren();for(const b of $('filters').children)b.setAttribute('aria-pressed',String(b.textContent===category));for(const [id,name,type,color,src] of products){if(category!=='All'&&category!==type)continue;const card=document.createElement('article');card.style.setProperty('--bg',color);card.innerHTML='<div class="frame"><img alt="'+name+'" src="'+src+'"></div><h3>'+name+'</h3><div class="type">'+type+'</div>';const add=button('Add to cart',()=>{const full=basket[id]>=99;change(id,1);$('notice').textContent=full?'Quantity limit reached':name+' added';clearTimeout(timer);timer=setTimeout(()=>$('notice').textContent='',2000)});add.className='buy';card.append(add);$('grid').append(card)}}
for(const category of ['All','Calendars','Stickers','Stationery'])$('filters').append(button(category,()=>display(category)));
$('bag').onclick=()=>$('cart').showModal();$('closeCart').onclick=()=>$('cart').close();display('All');refresh();
</script></html>
